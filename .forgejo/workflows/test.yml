name: Test

# The forge's gate for this fork. Actions were off here, and the 23 upstream workflows under
# `.github/workflows` assume GitHub (windows/macos runners, benches, fuzzing, release). A present
# `.forgejo/workflows` is what the forge reads instead, so none of those run and the upstream files
# stay untouched for clean syncs.
#
# SCOPE IS DELIBERATELY THE TEST SUITE ONLY: `cargo test` from upstream ci.yml's `check` job. Its
# clippy passes, NAPI build and contract-drift gates are not ported. The runner executes on the
# AIroborOS host (labels ubuntu-latest:host, Nice=10), which also serves the forge, the site and the
# agents, and a Rust workspace build is the heaviest thing this forge would run. Add steps when the
# host has headroom for them.
#
# The toolchain installs into the runner user's home and persists between runs, so only the first
# run pays the download; rust-toolchain.toml then selects the pinned channel and its components.
# A `run:` step, not dtolnay/rust-toolchain: this forge resolves bare `uses:` names through
# data.forgejo.org, which does not mirror that action (measured 2026-09-14: the job died cloning it).

on:
  pull_request:
  # No `push:` -- CI is preventative only, nothing runs after a merge (operator, 2026-09-15).
  workflow_dispatch:

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: cargo test
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust (rust-toolchain.toml pin)
        run: |
          if [ ! -x "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          fi
          "$HOME/.cargo/bin/rustup" toolchain install 1.97.1 --profile minimal --component clippy,rustfmt
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      # The CLI's audit tests spawn the type-aware sidecar (node), so its dependencies must exist
      # before `cargo test` -- upstream's check job does this; the first forge run without it failed
      # on ERR_MODULE_NOT_FOUND.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install type-aware sidecar dependencies
        run: npm ci --prefix tools/type-aware-sidecar --no-audit --no-fund --ignore-scripts
      # sccache: a compile cache keyed on each crate's source content, shared by every Rust gate on
      # this runner. Not a shared target/ (a stale-code false green, 2026-09-15): each job keeps its own target/ and its own server,
      # and an entry is only reused when the inputs hash the same. SCCACHE_BASEDIRS strips this job's
      # random workspace path so dependencies hit across jobs; workspace crates still hash their
      # absolute paths, so the PR's own code always rebuilds (proved 2026-10-21: a fault in a cached
      # crate still failed). 4G cap: the runner's disk is near full.
      - name: sccache (serialised install)
        run: |
          S="$HOME/.cache/sccache-0.18.0"; mkdir -p "$HOME/.rustup" "$S"
          flock "$HOME/.rustup/.ci-install.lock" sh -euc '
            [ -x "$0/sccache" ] && exit 0
            curl -fsSL -o "$0.tgz" https://github.com/mozilla/sccache/releases/download/v0.18.0/sccache-v0.18.0-x86_64-unknown-linux-musl.tar.gz
            printf "%s  %s\n" 45f1447fbe231e3037bde351ef70677dd212216c8d62ae7ca409fecc4d6acc89 "$0.tgz" | sha256sum -c --quiet
            tar xzf "$0.tgz" -C "$0" --strip-components=1 sccache-v0.18.0-x86_64-unknown-linux-musl/sccache
            rm "$0.tgz"
          ' "$S"
          { echo "RUSTC_WRAPPER=$S/sccache"; echo "SCCACHE_DIR=$HOME/.cache/sccache"; echo "SCCACHE_CACHE_SIZE=4G"
            echo "SCCACHE_BASEDIRS=$GITHUB_WORKSPACE"; echo "SCCACHE_SERVER_UDS=$(mktemp -u /tmp/sccache-XXXXXXXX.sock)"
            echo "CARGO_INCREMENTAL=0"; } >> "$GITHUB_ENV"
      - name: Run tests
        run: cargo test --workspace --lib --bins --tests --examples
      # The hit rate goes in the log, and the job's server does not outlive it. Never fails: a cancelled
      # job's server is already dead, and a failing stop turned that cancellation into a red (cmux job 36085).
      - name: sccache stats, stop
        if: always()
        run: '[ -z "${RUSTC_WRAPPER:-}" ] || { "$RUSTC_WRAPPER" --show-stats; "$RUSTC_WRAPPER" --stop-server; } || true'
